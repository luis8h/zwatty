; FTMS smart trainer simulator for ESP32
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800        ; lower to 115200 if flashing fails on your board

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
